version: "3.9"

services:

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    networks:
      - todo-network

  backend:
    build:
      context: ./server

    container_name: todo-backend

    restart: unless-stopped

    depends_on:
      - mongodb

    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/todo
      JWT_SECRET_KEY: abcdefghijklmnop

    ports:
      - "5000:5000"

    networks:
      - todo-network

  frontend:
    build:
      context: ./client

    container_name: todo-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:80"

    networks:
      - todo-network

volumes:
  mongo-data:

networks:
  todo-network:
    driver: bridge